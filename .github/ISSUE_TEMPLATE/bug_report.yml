name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include your AgentArmy URL or token.
        Security issues go through private advisories, see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `npx agentarmy`
        2. Create a console in ...
        3. ...
    validations:
      required: true
  - type: input
    id: agentarmy-version
    attributes:
      label: AgentArmy version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: Windows 11 24H2 / macOS 15.4 / Ubuntu 24.04
  - type: input
    id: node-version
    attributes:
      label: Node version (`node --version`)
      placeholder: v22.12.0
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version (`claude --version`)
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output from the terminal running `npx agentarmy` and the browser console. Remove tokens first.
      render: text
