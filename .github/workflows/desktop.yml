name: Desktop

# Windows desktop app (Electron). Push a tag desktop-v<package.json version> (e.g. desktop-v0.1.0)
# to build the installer and attach it to a DRAFT GitHub Release; review the draft, then publish it.
# Installed apps only update from published (non-draft) desktop-v* releases that carry latest.yml
# (src/desktop/updater.ts). Manual runs (workflow_dispatch) only build and keep the installer as a
# workflow artifact.
#
# The installer is NOT code-signed yet, so Windows SmartScreen warns on first run
# ("Windows protected your PC" -> More info -> Run anyway). To sign, add repository secrets with a
# code-signing certificate and set CSC_LINK / CSC_KEY_PASSWORD on the build step below; electron-builder then
# signs AgentArmy.exe and the installer automatically.

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # create the draft GitHub Release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          EXPECTED="desktop-v$(node -p "require('./package.json').version")"
          if [ "$EXPECTED" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version ($EXPECTED)"
            exit 1
          fi

      # To sign, add an env block here:
      #   env:
      #     CSC_LINK: ${{ secrets.WIN_CSC_LINK }}                  # .pfx as base64 or https URL
      #     CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Build installer
        run: npm run desktop:dist

      - name: Smoke test the packaged app
        run: npx playwright test -c playwright.desktop.config.ts
        env:
          DESKTOP_EXE: ${{ github.workspace }}\release\win-unpacked\AgentArmy.exe

      - uses: actions/upload-artifact@v4
        with:
          name: AgentArmy-windows
          path: |
            release/AgentArmy-Setup-*.exe
            release/AgentArmy-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Upload to a draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          FILES="release/AgentArmy-Setup-$VERSION.exe release/AgentArmy-Setup-$VERSION.exe.blockmap release/latest.yml"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $FILES --clobber
          else
            gh release create "$GITHUB_REF_NAME" $FILES --draft --verify-tag \
              --title "AgentArmy desktop $VERSION" \
              --notes "Windows installer for AgentArmy $VERSION. Unsigned: SmartScreen may warn (More info -> Run anyway)."
          fi
